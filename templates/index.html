<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EmoSense AI — Live Emotion Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Light Theme Tokens ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;
  --surface:#ffffff;
  --surface2:#f1f5f9;
  --border:#e2e8f0;
  --border2:#cbd5e1;
  --primary:#4f46e5;
  --primary-glow:rgba(79,70,229,0.1);
  --text:#0f172a;
  --text2:#334155;
  --muted:#64748b;
  --green:#10b981;
  --green-d:rgba(16,185,129,0.1);
  --red:#ef4444;
  --red-d:rgba(239,68,68,0.1);
  --r:16px;--r2:12px;--r3:8px;
  --ease:cubic-bezier(0.4,0,0.2,1);
  --tr:0.25s var(--ease);
  --shadow:0 10px 15px -3px rgba(0,0,0,0.05),0 4px 6px -4px rgba(0,0,0,0.05);
  --shadow-sm:0 1px 3px 0 rgba(0,0,0,0.1),0 1px 2px -1px rgba(0,0,0,0.1);
}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ── Header ── */
header{
  position:sticky;top:0;z-index:200;
  height:68px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--primary),#818cf8);
  border-radius:10px;
  display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(79,70,229,0.3);
  flex-shrink:0;
}
.logo-mark svg{width:20px;height:20px}
.logo-text{display:flex;flex-direction:column}
.logo-name{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.2rem;font-weight:700;
  letter-spacing:-0.02em;
  color:var(--text);
}
.logo-sub{font-size:0.65rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:0.04em}

.hdr-right{display:flex;align-items:center;gap:16px}
.hdr-pills{display:flex;gap:10px}
.pill{
  display:flex;flex-direction:column;align-items:center;
  padding:4px 16px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:24px;
  min-width:64px;
}
.pill-v{
  font-family:'Space Grotesk',sans-serif;
  font-size:0.9rem;font-weight:700;color:var(--text);
}
.pill-l{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600}

.status{
  display:flex;align-items:center;gap:8px;
  padding:6px 16px;border-radius:24px;
  font-size:0.75rem;font-weight:600;
  background:var(--red-d);color:var(--red);
  border:1px solid rgba(239,68,68,0.2);
  transition:all var(--tr);
}
.status.live{
  background:var(--green-d);color:var(--green);
  border-color:rgba(16,185,129,0.2);
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:currentColor;flex-shrink:0;
}
.status.live .status-dot{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px currentColor}50%{opacity:0.3;box-shadow:none}}

/* ── Layout ── */
.layout{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:24px;
  padding:28px 32px;
  max-width:1440px;
  margin:0 auto;
  align-items:start;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:border-color var(--tr);
}
.card:hover{border-color:var(--border2)}
.card-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.card-title{
  display:flex;align-items:center;gap:8px;
  font-size:0.75rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);
}
.card-title svg{width:16px;height:16px;color:var(--primary)}
.card-body{padding:20px}

/* ── Camera column ── */
.left-col{display:flex;flex-direction:column;gap:24px}

/* ── Camera feed ── */
.cam-wrap{
  position:relative;
  background:#1a1a2e; /* dark background for letterboxing */
  aspect-ratio:4/3;
  max-height:55vh; /* Ensure it fits on smaller laptop screens without zooming out */
  overflow:hidden;
  border-bottom:1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}
#cam-canvas{
  display:block;width:100%;height:100%;
  object-fit:contain; /* Prevent cropping */
  transition:opacity var(--tr);
  opacity:0.9;
}
#cam-col.live #cam-canvas{opacity:1}

/* Camera tags & overlays */
.cam-tag{
  position:absolute;top:16px;right:16px;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
  border-radius:var(--r3);
  padding:6px 12px;
  font-size:0.75rem;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:6px;
  opacity:0;transition:opacity 0.3s;
  box-shadow:var(--shadow-sm);
}
#cam-col.live .cam-tag{opacity:1}
.cam-tag svg{width:14px;height:14px;color:var(--primary)}

.overlay{
  position:absolute;inset:0;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(248,250,252,0.85);
  backdrop-filter:blur(8px);
  z-index:10;
}
.overlay.show{display:flex}
.spinner{
  width:40px;height:40px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay-msg{font-size:0.9rem;color:var(--text2);font-weight:600}

/* ── Controls bar ── */
.controls{
  display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;
  padding:16px 20px;
  background:var(--bg);
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:var(--r3);border:none;
  font-family:Inter,sans-serif;font-size:0.85rem;font-weight:600;
  cursor:pointer;transition:all var(--tr);
}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn:active{transform:scale(0.96)}

.btn-primary{
  background:var(--primary);
  color:#fff;
  box-shadow:0 4px 12px rgba(79,70,229,0.2);
}
.btn-primary:hover{background:#4338ca;box-shadow:0 6px 16px rgba(79,70,229,0.3);transform:translateY(-1px)}

.btn-danger{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--red);
}
.btn-danger:hover{background:var(--red-d);border-color:rgba(239,68,68,0.3)}

.btn-ghost{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text2);
}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}

.cam-switch{display:flex;align-items:center;gap:8px;margin-left:auto}
.cam-select{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  font-family:Inter,sans-serif;
  font-size:0.85rem;font-weight:500;
  padding:10px 14px;
  border-radius:var(--r3);
  cursor:pointer;
  outline:none;
  transition:border-color var(--tr);
  box-shadow:var(--shadow-sm);
}
.cam-select:hover{border-color:var(--border2)}

/* ── Right column ── */
.right-col{display:flex;flex-direction:column;gap:24px}

/* ── Emotion display ── */
.emo-hero{
  display:flex;flex-direction:column;align-items:center;
  padding:32px 20px;
  position:relative;
  background:var(--surface);
}

/* Confidence bar */
.conf-wrap{
  width:100%;max-width:240px;
  margin-top:16px;
  display:flex;flex-direction:column;gap:6px;
}
.conf-header{
  display:flex;justify-content:space-between;
  font-size:0.75rem;font-weight:600;color:var(--muted);
}
.conf-track{
  height:8px;background:var(--surface2);
  border-radius:99px;overflow:hidden;
}
.conf-fill{
  height:100%;border-radius:99px;
  transition:width 0.4s var(--ease), background 0.3s ease;
}

.emo-emoji{
  font-size:4rem;line-height:1;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,0.1));
  transition:transform 0.3s ease;
  margin-bottom:12px;
}
.emo-name{
  font-family:'Space Grotesk',sans-serif;
  font-size:2rem;font-weight:800;
  letter-spacing:-0.02em;
  color:var(--text);
  transition:color 0.3s ease;
}

/* ── Probability bars ── */
.prob-bars{display:flex;flex-direction:column;gap:12px}
.bar-item{}
.bar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bar-name{
  display:flex;align-items:center;gap:8px;
  font-size:0.8rem;font-weight:600;color:var(--text2);
}
.bar-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.bar-pct{font-size:0.8rem;font-weight:700;font-family:'Space Grotesk',sans-serif}
.bar-track{
  height:8px;background:var(--surface2);
  border-radius:99px;overflow:hidden;
}
.bar-fill{
  height:100%;border-radius:99px;width:0%;
  transition:width 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
}

/* ── Timeline chart ── */
.chart-section{padding:0 32px 32px;max-width:1440px;margin:0 auto}
.chart-canvas-wrap{padding:12px 16px;background:var(--surface)}
#emo-chart{width:100%;display:block}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 16px 12px;background:var(--surface)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text2);font-weight:500}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Toast ── */
.toast{
  position:fixed;bottom:32px;right:32px;z-index:999;
  background:var(--text);color:var(--surface);
  border-radius:var(--r2);
  padding:14px 20px;
  font-size:0.9rem;font-weight:600;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 25px -5px rgba(0,0,0,0.2);
  opacity:0;transform:translateY(16px);
  transition:all 0.3s var(--ease);
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast svg{color:var(--green)}

/* ── Responsive ── */
@media(max-width:960px){
  .layout{grid-template-columns:1fr}
}
@media(max-width:600px){
  header{padding:0 20px}
  .layout,.chart-section{padding-left:20px;padding-right:20px}
  .hdr-pills{display:none}
  .cam-switch{margin-left:0;width:100%}
  .cam-select{width:100%}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">
      <svg fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    <div class="logo-text">
      <div class="logo-name">EmoSense AI</div>
      <div class="logo-sub">Live Emotion Tracking</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="hdr-pills">
      <div class="pill"><div class="pill-v" id="h-fps">—</div><div class="pill-l">FPS</div></div>
      <div class="pill"><div class="pill-v" id="h-faces">0</div><div class="pill-l">Faces</div></div>
    </div>
    <div class="status" id="status"><div class="status-dot"></div><span id="status-lbl">Offline</span></div>
  </div>
</header>

<div class="layout">
  <!-- Left Column -->
  <div class="left-col" id="cam-col">
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="15" height="10" rx="2"/><path d="M17 9l5-2v10l-5-2"/>
          </svg>
          Live Camera
        </span>
      </div>
      <div class="cam-wrap" id="cam-wrap">
        <canvas id="cam-canvas"></canvas>
        <div class="cam-tag" id="cam-tag">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
          <span id="cam-tag-name">Camera</span>
        </div>
        <div class="overlay" id="overlay">
          <div class="spinner"></div>
          <div class="overlay-msg" id="overlay-msg">Connecting…</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="btn-start">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>Start
        </button>
        <button class="btn btn-danger" id="btn-stop">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>Stop
        </button>
        <button class="btn btn-ghost" id="btn-snap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>Snapshot
        </button>
        <div class="cam-switch">
          <select class="cam-select" id="cam-select" title="Switch camera"></select>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Column -->
  <div class="right-col">
    <!-- Emotion Hero -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>Detected Emotion
        </span>
      </div>
      <div class="emo-hero">
        <div class="emo-emoji" id="dom-emoji">😐</div>
        <div class="emo-name" id="dom-name">Neutral</div>
        
        <div class="conf-wrap">
          <div class="conf-header">
            <span>Confidence</span>
            <span id="dom-pct">0%</span>
          </div>
          <div class="conf-track">
            <div class="conf-fill" id="conf-fill" style="background:var(--muted);width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Probability Bars -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
          </svg>Live Probabilities
        </span>
      </div>
      <div class="card-body">
        <div class="prob-bars" id="prob-bars"></div>
      </div>
    </div>
  </div>
</div>

<!-- Timeline -->
<div class="chart-section">
  <div class="card">
    <div class="card-hdr">
      <span class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23,6 13.5,15.5 8.5,10.5 1,18"/>
        </svg>Emotion Timeline
      </span>
      <span id="chart-info" style="font-size:0.75rem;color:var(--muted);font-weight:500">No data yet</span>
    </div>
    <div class="chart-canvas-wrap"><canvas id="emo-chart" height="180"></canvas></div>
    <div class="chart-legend" id="chart-legend"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20,6 9,17 4,12"/></svg>
  <span id="toast-msg"></span>
</div>

<script>
/* ── Config from Flask ── */
const EMOTIONS = {{ emotions|tojson }};
const COLORS   = {{ colors|tojson }};
const EMOJIS   = {{ emojis|tojson }};

// Light theme specific overrides for better contrast on white
const LIGHT_COLORS = {
  'Angry': '#dc2626',
  'Disgust': '#059669',
  'Fear': '#7c3aed',
  'Happy': '#d97706',
  'Neutral': '#64748b',
  'Sad': '#2563eb',
  'Surprise': '#ea580c'
};

const canvas = document.getElementById('cam-canvas');
const ctx = canvas.getContext('2d');
const camCol = document.getElementById('cam-col');
const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlay-msg');

let isRunning = false;
let frameFails = 0;
let framePend = false;
let chartData = [];
let lastHistLen = 0;
let cameras = [];
let camIdx = 0;

function resizeCanvas() {
  const w = canvas.offsetWidth;
  canvas.width = w;
  canvas.height = Math.round(w * 3 / 4);
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); drawChart(); });

function drawPlaceholder(msg = 'Camera offline') {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  ctx.fillStyle = '#64748b';
  ctx.font = '500 15px Inter';
  ctx.textAlign = 'center';
  ctx.fillText(msg, canvas.width / 2, canvas.height / 2);
  ctx.textAlign = 'left';
}
drawPlaceholder('Initializing...');

const HAS_BITMAP = typeof createImageBitmap === 'function';
const _img = new Image();
_img.onload = function () {
  ctx.drawImage(_img, 0, 0, canvas.width, canvas.height);
  if (_img._u) { URL.revokeObjectURL(_img._u); _img._u = null; }
};

async function frameLoop() {
  if (!framePend) {
    framePend = true;
    try {
      const r = await fetch('/frame?_=' + performance.now(), { cache: 'no-store' });
      if (r.ok) {
        const blob = await r.blob();
        if (HAS_BITMAP) {
          try {
            const bm = await createImageBitmap(blob);
            ctx.drawImage(bm, 0, 0, canvas.width, canvas.height);
            bm.close();
          } catch {
            const u = URL.createObjectURL(blob);
            if (_img._u) URL.revokeObjectURL(_img._u);
            _img._u = u; _img.src = u;
          }
        } else {
          const u = URL.createObjectURL(blob);
          if (_img._u) URL.revokeObjectURL(_img._u);
          _img._u = u; _img.src = u;
        }
        frameFails = 0;
        overlay.classList.remove('show');
      } else {
        frameFails++;
      }
    } catch { frameFails++; }
    framePend = false;
    if (frameFails >= 18) {
      frameFails = 0;
      overlayMsg.textContent = 'Reconnecting...';
      overlay.classList.add('show');
      if (!isRunning) autoStart();
    }
  }
  setTimeout(frameLoop, 33);
}
frameLoop();

function setLive(live) {
  isRunning = live;
  document.getElementById('status').classList.toggle('live', live);
  document.getElementById('status-lbl').textContent = live ? 'Live' : 'Offline';
  camCol.classList.toggle('live', live);
  if (!live) drawPlaceholder('Camera offline');
}

async function loadCameras() {
  try {
    const r = await fetch('/cameras');
    cameras = await r.json();
  } catch {
    cameras = [{ index: 0, name: 'Camera 0' }];
  }
  populateCamSelect();
}

function populateCamSelect() {
  const sel = document.getElementById('cam-select');
  sel.innerHTML = cameras.map((c, i) => `<option value="${i}">${c.name}</option>`).join('');
}

document.getElementById('cam-select').addEventListener('change', async function () {
  camIdx = parseInt(this.value);
  const cam = cameras[camIdx];
  if (!cam) return;
  overlayMsg.textContent = 'Switching to ' + cam.name;
  overlay.classList.add('show');
  document.getElementById('cam-tag-name').textContent = cam.name;
  try {
    await fetch('/control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'switch_camera', camera: cam.index, name: cam.name }),
    });
    setLive(true);
    setTimeout(() => overlay.classList.remove('show'), 1400);
  } catch { overlay.classList.remove('show'); }
});

async function startCamera(idx) {
  const cam = cameras[idx ?? camIdx] || cameras[0] || { index: 0, name: 'Camera 0' };
  overlayMsg.textContent = 'Starting ' + cam.name;
  overlay.classList.add('show');
  try {
    const r = await fetch('/control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'start', camera: cam.index, name: cam.name }),
    });
    const d = await r.json();
    if (d.status === 'started' || d.status === 'already_running') {
      setLive(true);
      document.getElementById('cam-tag-name').textContent = cam.name;
      setTimeout(() => overlay.classList.remove('show'), 1000);
    }
  } catch { overlay.classList.remove('show'); }
}

async function stopCamera() {
  await fetch('/control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'stop' }),
  });
  setLive(false);
}

async function autoStart() {
  await loadCameras();
  await startCamera(0);
}

document.getElementById('btn-start').addEventListener('click', () => startCamera());
document.getElementById('btn-stop').addEventListener('click', stopCamera);
document.getElementById('btn-snap').addEventListener('click', async () => {
  const r = await fetch('/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'screenshot' }) });
  const d = await r.json();
  if (d.status === 'saved') showToast('Snapshot saved: ' + d.file);
});

function buildProbBars() {
  document.getElementById('prob-bars').innerHTML = EMOTIONS.map(e => `
    <div class="bar-item">
      <div class="bar-header">
        <span class="bar-name"><span class="bar-dot" style="background:${LIGHT_COLORS[e]}"></span>${e}</span>
        <span class="bar-pct" id="pct-${e}" style="color:${LIGHT_COLORS[e]}">0%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="bar-${e}" style="background:${LIGHT_COLORS[e]}"></div></div>
    </div>`).join('');
}

function buildChartLegend() {
  document.getElementById('chart-legend').innerHTML = EMOTIONS.map(e => `
    <div class="legend-item"><span class="legend-dot" style="background:${LIGHT_COLORS[e]}"></span>${e}</div>
  `).join('');
}

function updateEmotion(probs, top, conf) {
  EMOTIONS.forEach(e => {
    const p = (probs[e] ?? 0) * 100;
    document.getElementById(`bar-${e}`).style.width = p.toFixed(1) + '%';
    document.getElementById(`pct-${e}`).textContent = p.toFixed(0) + '%';
  });
  document.getElementById('dom-emoji').textContent = EMOJIS[top] || '😐';
  
  const nm = document.getElementById('dom-name');
  nm.textContent = top;
  nm.style.color = LIGHT_COLORS[top] || 'var(--text)';
  
  const cFill = document.getElementById('conf-fill');
  cFill.style.width = Math.round(conf) + '%';
  cFill.style.background = LIGHT_COLORS[top] || 'var(--muted)';
  
  document.getElementById('dom-pct').textContent = Math.round(conf) + '%';
}

function drawChart() {
  const c = document.getElementById('emo-chart');
  const cx = c.getContext('2d');
  const W = c.width, H = c.height, N = chartData.length;
  cx.clearRect(0, 0, W, H);
  if (N < 2) {
    cx.fillStyle = '#94a3b8';
    cx.font = '500 13px Inter'; cx.textAlign = 'center';
    cx.fillText('Start camera to record timeline', W / 2, H / 2);
    return;
  }
  const pL=20,pR=20,pT=10,pB=26;
  const pw=W-pL-pR, ph=H-pT-pB;

  cx.strokeStyle = '#e2e8f0';
  cx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pT + ph * i / 4;
    cx.beginPath(); cx.moveTo(pL, y); cx.lineTo(W - pR, y); cx.stroke();
  }

  EMOTIONS.forEach(e => {
    cx.beginPath();
    cx.strokeStyle = LIGHT_COLORS[e];
    cx.lineWidth = 2.5;
    cx.lineJoin = 'round';
    chartData.forEach((d, i) => {
      const x = pL + (i / (N - 1)) * pw;
      const y = pT + ph - (d[e] ?? 0) * ph;
      i === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
    });
    cx.stroke();
  });

  cx.fillStyle = '#64748b';
  cx.font = '500 10px Inter'; cx.textAlign = 'center';
  const step = Math.max(1, Math.floor(N / 7));
  for (let i = 0; i < N; i += step) {
    const x = pL + (i / (N - 1)) * pw;
    cx.fillText(chartData[i].ts || '', x, H - 6);
  }
}
window.addEventListener('resize', () => {
  const c = document.getElementById('emo-chart');
  c.width = c.offsetWidth;
  drawChart();
});

async function poll() {
  try {
    const [er, hr] = await Promise.all([ fetch('/emotion_data'), fetch('/history') ]);
    const emo = await er.json();
    const hist = await hr.json();

    if (isRunning !== emo.running) setLive(emo.running);

    document.getElementById('h-fps').textContent = emo.fps || '—';
    document.getElementById('h-faces').textContent = emo.face_count;

    if (emo.current_cam_name) {
      document.getElementById('cam-tag-name').textContent = emo.current_cam_name;
      const i = cameras.findIndex(c => c.index === emo.current_cam);
      if (i >= 0) { camIdx = i; document.getElementById('cam-select').value = i; }
    }

    updateEmotion(emo.emotion_probs, emo.top_emotion, emo.confidence);

    if (hist.length !== lastHistLen) {
      lastHistLen = hist.length;
      chartData = hist;
      const c = document.getElementById('emo-chart');
      c.width = c.offsetWidth;
      drawChart();
      document.getElementById('chart-info').textContent = 'Last ' + hist.length + ' readings';
    }
  } catch {}
}
setInterval(poll, 200);

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

buildProbBars();
buildChartLegend();

(async () => {
  await loadCameras();
  await startCamera(0);
  setTimeout(() => { if (!isRunning) startCamera(0); }, 2500);
})();
</script>
</body>
